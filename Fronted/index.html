        .suggest-list { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: 0; padding: 5px 0; list-style: none; display: none; max-height: 250px; overflow-y: auto; }

        .my-location-btn { position: absolute; bottom: 30px; right: 15px; z-index: 1000; background: white; border: none; border-radius: 50%; width: 50px; height: 50px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #5f6368; transition: 0.3s; }
        .my-location-btn:hover { background: #f1f3f4; }
        .my-location-btn.active { color: #1a73e8; }

</head>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('PWA cài đặt thành công!'))
                .catch(err => console.log('Lỗi PWA:', err));
        });
    }
</script>
<body>
    <div id="map"></div>
    <button id="myLocationBtn" class="my-location-btn" onclick="focusUserLocation()">
        <i class="fas fa-crosshairs"></i>
    </button>

    <div class="search-panel">
        <div class="search-box-container">
            <i class="fas fa-bars menu-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm trên Tuyến Xanh..." oninput="handleAutoSuggest()">
            <i class="fas fa-search search-icon" onclick="executeSearch()"></i>
        </div>
        <ul id="suggestList" class="suggest-list"></ul>
        <div class="chip-container">
            <button class="chip active" onclick="applyFilter('all', this)">Tất cả</button>
            <button class="chip" onclick="applyFilter('park', this)">Công viên</button>
            <button class="chip" onclick="applyFilter('other', this)">Di tích / Khác</button>
        </div>
    </div>

    <div id="infoSidebar" class="sidebar">
        <div class="sidebar-header">
            <button class="close-btn" onclick="closeSidebar()"><i class="fas fa-times"></i></button>
            <h2 id="sidebarTitle" class="sidebar-title">Tên địa điểm</h2>
        </div>
        <div class="sidebar-body">
            <div class="sidebar-guide-text">
                <i class="fas fa-info-circle" style="color: #1a73e8; margin-right: 5px;"></i>
            </div>
            
            <div class="action-buttons">
                <button id="sidebarPlayBtn" class="play-btn"><i class="fas fa-volume-up"></i> Nghe giới thiệu</button>
                <button id="sidebarRouteBtn" class="route-btn"><i class="fas fa-directions"></i> Đường đi</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    
    <script>
        const map = L.map('map', { zoomControl: false }).setView([10.775, 106.694], 15);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        let userLocation = null; 
        let routingControl = null;

        let userMarker = null;
        let userCircle = null;
        let isFollowingUser = false; 

        map.locate({setView: true, maxZoom: 17, watch: true, enableHighAccuracy: true});

        map.on('locationfound', function(e) {
            userLocation = e.latlng; 
            var radius = e.accuracy / 2;

            if (!userMarker) {
                var userIcon = L.divIcon({ 
                    className: 'user-marker', 
                    html: '<div style="background-color: #1a73e8; width: 18px; height: 18px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>', 
                    iconSize: [24, 24], iconAnchor: [12, 12] 
                });
                userMarker = L.marker(e.latlng, {icon: userIcon, zIndexOffset: 1000}).addTo(map);
                userCircle = L.circle(e.latlng, radius, { color: '#1a73e8', fillColor: '#1a73e8', fillOpacity: 0.15, weight: 1 }).addTo(map);
            } else {
                userMarker.setLatLng(e.latlng);
                userCircle.setLatLng(e.latlng);
                userCircle.setRadius(radius);
            }

            if (isFollowingUser) map.setView(e.latlng);
        });

        map.on('locationerror', function(e) { console.log("Lỗi GPS: " + e.message); });

        window.focusUserLocation = function() {
            if (!userLocation) { alert("Đang tìm tín hiệu vệ tinh, vui lòng chờ..."); return; }
            isFollowingUser = true;
            document.getElementById('myLocationBtn').classList.add('active'); 
            map.flyTo(userLocation, 18, { duration: 1 }); 
        };

        map.on('dragstart', function() {
            isFollowingUser = false;
            document.getElementById('myLocationBtn').classList.remove('active'); 
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 19 }).addTo(map);

        let allPointsData = []; 
        let activeMarkers = [];
        let currentFilterType = 'all';
        let currentSearchText = '';
        let currentUtterance = null;

        async function loadGreenPoints() {
            try {
                const response = await fetch("https://localhost:7047/api/points");
                allPointsData = await response.json();
                renderPoints(); 
            } catch (error) { console.error("Lỗi tải dữ liệu từ C#:", error); }
        }

        window.renderPoints = function() {
            activeMarkers.forEach(marker => map.removeLayer(marker));
            activeMarkers = []; 

            const redPinIcon = L.divIcon({
                className: 'custom-red-pin',
                html: '<div style="color: #ea4335; font-size: 38px; text-shadow: 2px 2px 5px rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: flex-end; width: 100%; height: 100%;"><i class="fas fa-map-marker-alt"></i></div>',
                iconSize: [38, 38],
                iconAnchor: [19, 38], 
                popupAnchor: [0, -38]
            });

            allPointsData.forEach(point => {
                let nameLower = point.name.toLowerCase();
                let isCategoryMatch = false;
                if (currentFilterType === 'all') isCategoryMatch = true;
                else if (currentFilterType === 'park' && nameLower.includes('công viên')) isCategoryMatch = true;
                else if (currentFilterType === 'other' && !nameLower.includes('công viên')) isCategoryMatch = true;

                let isSearchMatch = nameLower.includes(currentSearchText);

                if (isCategoryMatch && isSearchMatch) {
                    const marker = L.marker([point.lat, point.lng], { icon: redPinIcon }).addTo(map);
                    
                    marker.on('click', () => {
                        openSidebar(point);
                        map.flyTo([point.lat, point.lng], 16, { duration: 0.5 });
                    });
                    
                    activeMarkers.push(marker);
                }
            });
        };

        window.openSidebar = function(point) {
            document.getElementById('sidebarTitle').innerText = point.name;
            const playBtn = document.getElementById('sidebarPlayBtn');
            playBtn.onclick = function() { playAudio(point.guide, this); };
            playBtn.className = 'play-btn'; 
            playBtn.innerHTML = '<i class="fas fa-volume-up"></i> Nghe giới thiệu';

            const routeBtn = document.getElementById('sidebarRouteBtn');
            routeBtn.onclick = function() { drawRoute(point.lat, point.lng); closeSidebar(); };
            document.getElementById('infoSidebar').classList.add('active');
        };

        window.closeSidebar = function() {
            document.getElementById('infoSidebar').classList.remove('active');
            window.speechSynthesis.cancel(); 
        };

        window.handleAutoSuggest = function() {
            const inputVal = document.getElementById('searchInput').value.toLowerCase();
            const suggestBox = document.getElementById('suggestList');
            suggestBox.innerHTML = ''; 
            if (!inputVal) { suggestBox.style.display = 'none'; currentSearchText = ''; renderPoints(); return; }

            const matches = allPointsData.filter(p => p.name.toLowerCase().includes(inputVal));
            if (matches.length > 0) {
                suggestBox.style.display = 'block'; 
                matches.forEach(point => {
                    const li = document.createElement('li');
                    li.innerHTML = `<i class="fas fa-map-marker-alt" style="color:#ea4335;"></i> ${point.name}`;
                    li.onclick = () => {
                        document.getElementById('searchInput').value = point.name; 
                        suggestBox.style.display = 'none'; 
                        currentSearchText = point.name.toLowerCase();
                        renderPoints(); 
                        map.flyTo([point.lat, point.lng], 16, { duration: 1 });
                        setTimeout(() => { openSidebar(point); }, 1000); 
                    };
                    suggestBox.appendChild(li);
                });
            } else { suggestBox.style.display = 'none'; }
        };

        window.applyFilter = function(type, btnElement) {
            document.querySelectorAll('.chip').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            currentFilterType = type; renderPoints(); 
        };

        window.executeSearch = function() {
            currentSearchText = document.getElementById('searchInput').value.toLowerCase();
            document.getElementById('suggestList').style.display = 'none';
            renderPoints(); 
        };

        window.playAudio = function(text, btnElement) {
            window.speechSynthesis.cancel();
            if (btnElement.classList.contains('playing')) {
                btnElement.classList.remove('playing');
                btnElement.innerHTML = '<i class="fas fa-volume-up"></i> Nghe giới thiệu';
                return;
            }
            btnElement.classList.add('playing');
            btnElement.innerHTML = '<i class="fas fa-stop-circle"></i> Đang phát...';
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.lang = 'en-US';
            currentUtterance.rate = 0.9;
            currentUtterance.onend = function() {
                btnElement.classList.remove('playing');
                btnElement.innerHTML = '<i class="fas fa-volume-up"></i> Nghe giới thiệu';
            };
            window.speechSynthesis.speak(currentUtterance);
        };

        window.drawRoute = function(destLat, destLng) {
            if (!userLocation) { alert("Đang tìm vị trí của bạn..."); return; }
            if (routingControl) map.removeControl(routingControl);
            
            routingControl = L.Routing.control({
                waypoints: [ L.latLng(userLocation.lat, userLocation.lng), L.latLng(destLat, destLng) ],
                routeWhileDragging: false, 
                addWaypoints: false, 
                show: false,
                lineOptions: { styles: [{color: '#1a73e8', opacity: 0.8, weight: 6}] },
                
                createMarker: function() { return null; } 
            }).addTo(map);
        };

        loadGreenPoints();
    </script>
</body>
</html>
